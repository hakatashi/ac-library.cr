name: Run test and verifier

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  # Crystal version used on the AtCoder judge (2025-10 language update).
  JUDGE_CRYSTAL_VERSION: '1.17.0'

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        crystal:
          - '1.17.0'
          - latest
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: crystal-lang/install-crystal@v1
      with:
        crystal: ${{ matrix.crystal }}
    - name: Run tests
      run: crystal spec --verbose
    - name: Check standalone requires
      run: |
        for file in src/*.cr; do
          echo "Checking $file"
          crystal eval "require \"./$file\""
        done
    - name: Run benchmarks
      run: crystal run --release benchmarks/*

  coverage:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: crystal-lang/install-crystal@v1
      with:
        crystal: ${{ env.JUDGE_CRYSTAL_VERSION }}
    - name: Install kcov
      run: |
        sudo apt-get update
        sudo apt-get install -y binutils-dev libssl-dev libcurl4-openssl-dev zlib1g-dev libdw-dev libiberty-dev cmake
        git clone --depth 1 -b v43 https://github.com/SimonKagstrom/kcov.git /tmp/kcov
        cmake -S /tmp/kcov -B /tmp/kcov/build
        cmake --build /tmp/kcov/build -j"$(nproc)"
        sudo cmake --install /tmp/kcov/build
    - name: Run coverage
      run: |
        shards build test --without-development --ignore-crystal-version
        kcov --clean --include-path=src coverage ./bin/test
    - uses: codecov/codecov-action@v5
      with:
        directory: coverage
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: crystal-lang/install-crystal@v1
      with:
        crystal: ${{ env.JUDGE_CRYSTAL_VERSION }}
    - name: Install Crystal dependencies
      run: shards install
    - name: Run linter
      run: bin/ameba

  verify:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: crystal-lang/install-crystal@v1
      with:
        crystal: ${{ env.JUDGE_CRYSTAL_VERSION }}
    - uses: actions/setup-python@v5
      with:
        python-version-file: .python-version
        cache: pip
    - name: Cache .verify-helper
      uses: actions/cache@v4
      with:
        path: |
          .verify-helper/cache
          .verify-helper/timestamps.local.json
        key: ${{ runner.os }}-crystal-${{ env.JUDGE_CRYSTAL_VERSION }}-verify-helper-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-crystal-${{ env.JUDGE_CRYSTAL_VERSION }}-verify-helper-
    - name: Install Crystal dependencies
      run: |
        shards install
        # We only need bin directory. lib contains recursive symlink and troublesome.
        rm -rf lib
    - name: Install pip dependencies
      run: python -m pip install -r requirements.txt
    - name: Run verifier
      run: oj-verify run --jobs 4

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs:
    - test
    - lint
    - verify
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: crystal-lang/install-crystal@v1
      with:
        crystal: ${{ env.JUDGE_CRYSTAL_VERSION }}
    - uses: actions/setup-python@v5
      with:
        python-version-file: .python-version
        cache: pip
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'
    - name: Install Crystal dependencies
      run: |
        shards install
        # We only need bin directory. lib contains recursive symlink and troublesome.
        rm -rf lib
    - name: Install pip dependencies
      run: python -m pip install -r requirements.txt
    - name: Generate bundled docs
      run: oj-verify docs --jobs 4
    - name: Generate API docs
      run: crystal docs --progress --stats --time -o dist/api
    - name: Build bundled docs
      run: |
        bundle config set --local path .vendor/bundle
        bundle install --gemfile=.verify-helper/markdown/Gemfile
        bundle exec --gemfile=.verify-helper/markdown/Gemfile jekyll build --source .verify-helper/markdown --destination dist/docs --baseurl ac-library.cr/docs
    - name: Deploy docs to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./dist
